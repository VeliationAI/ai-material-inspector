<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · AI Material Inspector</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <p class="eyebrow">TGSPDCL Stores · Challenge 11</p>
      <h1>AI Material Inspector</h1>
      <p>Photograph porcelain insulators, validate against sample SAP purchase orders, and generate an inspection report.</p>
      <label for="email">Email</label>
      <input id="email" type="email" value="officer@tgspdcl.example" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" value="ChangeMeNow!23" autocomplete="current-password" />
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button id="loginBtn" type="button">Sign in</button>
        <button id="demoBtn" type="button" class="ghost">Demo login</button>
      </div>
    </div>
  </div>
  <script>
    const err = document.getElementById("error");
    async function login(json) {
      err.hidden = true;
      const res = await fetch(json ? "/api/v1/auth/token" : "/api/v1/auth/demo", {
        method: "POST",
        headers: json ? { "Content-Type": "application/json" } : undefined,
        body: json ? JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }) : undefined,
      });
      if (!res.ok) {
        err.textContent = "Sign-in failed";
        err.hidden = false;
        return;
      }
      const data = await res.json();
      localStorage.setItem("ami_token", data.access_token);
      localStorage.setItem("ami_user", JSON.stringify(data));
      location.href = "/";
    }
    document.getElementById("loginBtn").onclick = () => login(true);
    document.getElementById("demoBtn").onclick = () => login(false);
  </script>
</body>
</html>
